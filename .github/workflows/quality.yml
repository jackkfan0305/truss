name: Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Prisma generation needs a syntactically valid datasource URL but does
      # not connect. Live database checks are excluded from this workflow.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/truss
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          # Build-time placeholders only. The quality job never contacts these
          # services; live database/Liveblocks checks run locally through
          # `npm run verify:integration` with real development credentials.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZHVtbXkuY2xlcmsuYWNjb3VudHMuZGV2JA
          CLERK_SECRET_KEY: sk_test_ci_placeholder
